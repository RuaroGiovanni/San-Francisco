<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SF Travel Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Backgrounds */
        --sys-bg: #000000;
        --sys-bg-secondary: #1c1c1e;
        --sys-bg-tertiary: #2c2c2e;
        --sys-bg-grouped: #111111;
        /* Fills (translucent) */
        --sys-fill: rgba(120,120,128, 0.36);
        --sys-fill-secondary: rgba(120,120,128, 0.20);
        --sys-fill-tertiary: rgba(118,118,128, 0.12);
        /* Labels */
        --sys-label: #ffffff;
        --sys-label-secondary: rgba(235,235,245, 0.60);
        --sys-label-tertiary: rgba(235,235,245, 0.30);
        --sys-label-quaternary: rgba(235,235,245, 0.16);
        /* Separators */
        --sys-separator: rgba(84,84,88, 0.65);
        --sys-separator-opaque: #38383a;
        /* Accent colors */
        --sys-blue: #0a84ff; --sys-blue-light: rgba(10,132,255, 0.15);
        --sys-orange: #ff9f0a; --sys-orange-light: rgba(255,159,10, 0.15);
        --sys-green: #30d158; --sys-green-light: rgba(48,209,88, 0.15);
        --sys-red: #ff453a; --sys-red-light: rgba(255,69,58, 0.15);
        --sys-teal: #5ac8fa; --sys-teal-light: rgba(90,200,250, 0.12);
        --sys-purple: #bf5af2;
        --sys-indigo: #5e5ce6;
        /* Safe areas */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      
      body {
        background-color: var(--sys-bg);
        color: var(--sys-label);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        min-height: 100svh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-slide {
        animation: fadeSlideIn 0.3s cubic-bezier(0.4,0,0.2,1) forwards;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
      </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
